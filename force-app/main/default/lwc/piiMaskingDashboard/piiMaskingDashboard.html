<template>
    <div class="slds-card slds-var-m-around_medium dashboard-container">
        <!-- Header -->
        <div class="slds-card__header slds-grid header-bar">
            <div class="slds-media slds-media_center slds-has-flexi-truncate">
                <div class="slds-media__figure">
                    <lightning-icon icon-name="standard:data_streams" size="medium"></lightning-icon>
                </div>
                <div class="slds-media__body">
                    <h2 class="slds-card__header-title slds-text-heading_medium header-title">
                        PII Data Masking Dashboard
                    </h2>
                    <p class="slds-text-body_small slds-text-color_weak">Mask sensitive data in your Sandbox environment
                    </p>
                </div>
            </div>
            <div class="slds-no-flex">
                <lightning-button variant="brand" label="Run Masking" icon-name="utility:play"
                    onclick={handleStartMasking} disabled={isRunning} class="run-button">
                </lightning-button>
            </div>
        </div>

        <!-- Active Jobs -->
        <div class="slds-card__body slds-card__body_inner">
            <template if:true={hasActiveJobs}>
                <div class="slds-section slds-is-open slds-var-m-bottom_medium">
                    <h3 class="slds-section__title slds-theme_shade section-header">
                        <span class="slds-truncate slds-var-p-horizontal_small">
                            <lightning-icon icon-name="utility:spinner" size="x-small"
                                class="slds-var-m-right_x-small"></lightning-icon>
                            Active Jobs
                        </span>
                    </h3>
                    <div class="slds-section__content">
                        <template for:each={activeJobs} for:item="job">
                            <div key={job.id}
                                class="slds-box slds-box_x-small slds-var-m-bottom_small job-card active-job-card">
                                <div class="slds-grid slds-grid_align-spread slds-var-m-bottom_x-small">
                                    <div>
                                        <lightning-badge label={job.status} class="status-badge"></lightning-badge>
                                    </div>
                                    <div class="slds-text-body_small slds-text-color_weak">
                                        {job.processed} / {job.total} batches
                                    </div>
                                </div>
                                <lightning-progress-bar value={job.progress} size="medium"
                                    variant="circular"></lightning-progress-bar>
                                <div class="slds-text-align_right slds-text-body_small slds-var-m-top_xx-small">
                                    {job.progress}% complete
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </template>

            <!-- Add Configuration -->
            <div class="slds-section slds-is-open slds-var-m-bottom_medium">
                <h3 class="slds-section__title slds-theme_shade section-header">
                    <button class="slds-button slds-section__title-action" onclick={toggleConfigForm}>
                        <lightning-icon icon-name={configFormChevron} size="x-small"
                            class="slds-var-m-right_x-small slds-button__icon_left"></lightning-icon>
                        <span class="slds-truncate">
                            <lightning-icon icon-name="utility:add" size="x-small"
                                class="slds-var-m-right_x-small"></lightning-icon>
                            Add Masking Configuration
                        </span>
                    </button>
                </h3>
                <template if:true={showConfigForm}>
                    <div class="slds-section__content config-form-panel">
                        <div class="slds-grid slds-gutters slds-wrap">
                            <!-- Object Picker -->
                            <div class="slds-col slds-size_1-of-2 slds-var-p-bottom_small">
                                <lightning-combobox name="objectName" label="Object" placeholder="Select an Object..."
                                    options={objectOptions} value={selectedObject}
                                    onchange={handleObjectChange}></lightning-combobox>
                            </div>
                            <!-- Field Picker -->
                            <div class="slds-col slds-size_1-of-2 slds-var-p-bottom_small">
                                <lightning-combobox name="fieldName" label="Field" placeholder="Select a Field..."
                                    options={fieldOptions} value={selectedField} onchange={handleFieldChange}
                                    disabled={isFieldDisabled}></lightning-combobox>
                            </div>
                            <!-- Masking Type -->
                            <div class="slds-col slds-size_1-of-2 slds-var-p-bottom_small">
                                <lightning-combobox name="maskingType" label="Masking Type"
                                    placeholder="Select Masking Type..." options={maskingTypeOptions}
                                    value={selectedMaskingType} onchange={handleMaskingTypeChange}></lightning-combobox>
                            </div>
                            <!-- Pattern -->
                            <div class="slds-col slds-size_1-of-2 slds-var-p-bottom_small">
                                <lightning-input label="Pattern (optional)" value={configPattern}
                                    placeholder="e.g. .invalid or MASKED" onchange={handlePatternChange}
                                    field-level-help="For Static: the replacement value. For Suffix: appended to original."></lightning-input>
                            </div>
                        </div>
                        <div class="slds-grid slds-grid_align-end slds-var-m-top_small">
                            <lightning-button label="Cancel" onclick={handleCancelConfig}
                                class="slds-var-m-right_small"></lightning-button>
                            <lightning-button variant="brand" label="Save Configuration" icon-name="utility:save"
                                onclick={handleSaveConfig} disabled={isSaveDisabled}></lightning-button>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Configs -->
            <div class="slds-section slds-is-open slds-var-m-bottom_medium">
                <h3 class="slds-section__title slds-theme_shade section-header">
                    <span class="slds-truncate slds-var-p-horizontal_small">
                        <lightning-icon icon-name="utility:settings" size="x-small"
                            class="slds-var-m-right_x-small"></lightning-icon>
                        Masking Configuration
                    </span>
                </h3>
                <div class="slds-section__content">
                    <template if:true={hasConfigs}>
                        <lightning-datatable key-field="id" data={configs} columns={configColumns} hide-checkbox-column
                            class="config-table">
                        </lightning-datatable>
                    </template>
                    <template if:false={hasConfigs}>
                        <div
                            class="slds-illustration slds-illustration_small slds-var-p-around_medium slds-text-align_center">
                            <p class="slds-text-body_regular slds-text-color_weak">
                                No masking configurations found. Use the form above to add one.
                            </p>
                        </div>
                    </template>
                </div>
            </div>

            <!-- Job History -->
            <div class="slds-section slds-is-open">
                <h3 class="slds-section__title slds-theme_shade section-header">
                    <span class="slds-truncate slds-var-p-horizontal_small">
                        <lightning-icon icon-name="utility:date_time" size="x-small"
                            class="slds-var-m-right_x-small"></lightning-icon>
                        Job History
                    </span>
                </h3>
                <div class="slds-section__content">
                    <template if:true={hasHistory}>
                        <lightning-datatable key-field="id" data={jobHistory} columns={historyColumns}
                            hide-checkbox-column class="history-table">
                        </lightning-datatable>
                    </template>
                    <template if:false={hasHistory}>
                        <div class="slds-var-p-around_medium slds-text-align_center">
                            <p class="slds-text-body_regular slds-text-color_weak">No job history yet.</p>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast-like notification -->
    <template if:true={toastMessage}>
        <div class={toastClass}>
            <lightning-icon icon-name={toastIcon} size="x-small" class="slds-var-m-right_small"></lightning-icon>
            {toastMessage}
        </div>
    </template>
</template>
