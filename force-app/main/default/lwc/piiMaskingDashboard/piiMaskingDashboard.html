<template>
    <div class="slds-card slds-var-m-around_medium dashboard-container">
        <!-- Header -->
        <div class="slds-card__header slds-grid header-bar">
            <div class="slds-media slds-media_center slds-has-flexi-truncate">
                <div class="slds-media__figure">
                    <lightning-icon icon-name="standard:data_streams" size="medium"></lightning-icon>
                </div>
                <div class="slds-media__body">
                    <h2 class="slds-card__header-title slds-text-heading_medium header-title">
                        PII Data Masking Dashboard
                    </h2>
                    <p class="slds-text-body_small slds-text-color_weak">Auto-detect &amp; mask sensitive data in your
                        Sandbox</p>
                </div>
            </div>
            <div class="slds-no-flex">
                <lightning-button variant="brand" label="Run Masking" icon-name="utility:play"
                    onclick={handleStartMasking} disabled={isRunning} class="run-button">
                </lightning-button>
            </div>
        </div>

        <div class="slds-card__body slds-card__body_inner">

            <!-- Active Jobs -->
            <template if:true={hasActiveJobs}>
                <div class="slds-section slds-is-open slds-var-m-bottom_medium">
                    <h3 class="slds-section__title slds-theme_shade section-header">
                        <span class="slds-truncate slds-var-p-horizontal_small">
                            <lightning-icon icon-name="utility:spinner" size="x-small"
                                class="slds-var-m-right_x-small"></lightning-icon>
                            Active Jobs
                        </span>
                    </h3>
                    <div class="slds-section__content">
                        <template for:each={activeJobs} for:item="job">
                            <div key={job.id}
                                class="slds-box slds-box_x-small slds-var-m-bottom_small job-card active-job-card">
                                <div class="slds-grid slds-grid_align-spread slds-var-m-bottom_x-small">
                                    <lightning-badge label={job.status} class="status-badge"></lightning-badge>
                                    <span class="slds-text-body_small slds-text-color_weak">
                                        {job.processed} / {job.total} batches
                                    </span>
                                </div>
                                <lightning-progress-bar value={job.progress} size="medium"
                                    variant="circular"></lightning-progress-bar>
                                <div class="slds-text-align_right slds-text-body_small slds-var-m-top_xx-small">
                                    {job.progress}% complete
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </template>

            <!-- Add Object for Masking -->
            <div class="slds-section slds-is-open slds-var-m-bottom_medium">
                <h3 class="slds-section__title slds-theme_shade section-header">
                    <button class="slds-button slds-section__title-action" onclick={toggleConfigForm}>
                        <lightning-icon icon-name={configFormChevron} size="x-small"
                            class="slds-var-m-right_x-small slds-button__icon_left"></lightning-icon>
                        <span class="slds-truncate">
                            <lightning-icon icon-name="utility:add" size="x-small"
                                class="slds-var-m-right_x-small"></lightning-icon>
                            Add Object for Masking
                        </span>
                    </button>
                </h3>
                <template if:true={showConfigForm}>
                    <div class="slds-section__content config-form-panel">
                        <div class="slds-grid slds-gutters slds-wrap">
                            <div class="slds-col slds-size_1-of-1 slds-var-p-bottom_small">
                                <lightning-combobox name="objectName" label="Select Object"
                                    placeholder="Choose an object to mask..." options={objectOptions}
                                    value={selectedObject} onchange={handleObjectChange}>
                                </lightning-combobox>
                                <p class="slds-text-body_small slds-text-color_weak slds-var-m-top_xx-small">
                                    PII fields will be auto-detected based on field name &amp; type (Email, Phone, Name,
                                    Address, etc.)
                                </p>
                            </div>
                        </div>

                        <!-- Auto-detected PII Preview -->
                        <template if:true={hasPiiPreview}>
                            <div class="slds-var-m-top_small pii-preview-box">
                                <h4 class="slds-text-title_caps slds-var-m-bottom_x-small">
                                    <lightning-icon icon-name="utility:preview" size="xx-small"
                                        class="slds-var-m-right_xx-small"></lightning-icon>
                                    Auto-Detected PII Fields ({piiPreviewCount})
                                </h4>
                                <div class="slds-scrollable_y preview-table-container">
                                    <table
                                        class="slds-table slds-table_bordered slds-table_cell-buffer slds-table_fixed-layout">
                                        <thead>
                                            <tr class="slds-line-height_reset">
                                                <th scope="col">
                                                    <div class="slds-truncate">Field</div>
                                                </th>
                                                <th scope="col">
                                                    <div class="slds-truncate">Type</div>
                                                </th>
                                                <th scope="col">
                                                    <div class="slds-truncate">Masking</div>
                                                </th>
                                                <th scope="col" style="width:50px">
                                                    <div class="slds-truncate"></div>
                                                </th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template for:each={piiPreview} for:item="field">
                                                <tr key={field.fieldName}>
                                                    <td>
                                                        <div class="slds-truncate">{field.fieldName}</div>
                                                    </td>
                                                    <td>
                                                        <div class="slds-truncate">{field.fieldType}</div>
                                                    </td>
                                                    <td>
                                                        <lightning-combobox value={field.selectedMask}
                                                            options={maskingOptions} data-field={field.fieldName}
                                                            onchange={handleMaskChange} variant="label-hidden"
                                                            dropdown-alignment="left">
                                                        </lightning-combobox>
                                                    </td>
                                                    <td>
                                                        <lightning-button-icon icon-name="utility:close"
                                                            alternative-text="Remove" size="small" variant="bare"
                                                            data-field={field.fieldName} onclick={handleRemoveField}
                                                            class="remove-btn"></lightning-button-icon>
                                                    </td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </template>

                        <template if:true={noPiiFound}>
                            <div class="slds-var-m-top_small slds-text-color_weak slds-text-align_center">
                                <lightning-icon icon-name="utility:info" size="x-small"
                                    class="slds-var-m-right_xx-small"></lightning-icon>
                                No PII fields auto-detected for this object.
                            </div>
                        </template>

                        <div class="slds-grid slds-grid_align-end slds-var-m-top_small">
                            <lightning-button label="Cancel" onclick={handleCancelConfig}
                                class="slds-var-m-right_small"></lightning-button>
                            <lightning-button variant="brand" label="Add Object" icon-name="utility:save"
                                onclick={handleSaveConfig} disabled={isSaveDisabled}></lightning-button>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Current Config -->
            <div class="slds-section slds-is-open slds-var-m-bottom_medium">
                <h3 class="slds-section__title slds-theme_shade section-header">
                    <span class="slds-truncate slds-var-p-horizontal_small">
                        <lightning-icon icon-name="utility:settings" size="x-small"
                            class="slds-var-m-right_x-small"></lightning-icon>
                        Configured Objects
                    </span>
                </h3>
                <div class="slds-section__content">
                    <template if:true={hasConfigs}>
                        <lightning-datatable key-field="id" data={configs} columns={configColumns} hide-checkbox-column
                            onrowaction={handleConfigAction} class="config-table">
                        </lightning-datatable>
                    </template>
                    <template if:false={hasConfigs}>
                        <div class="slds-var-p-around_medium slds-text-align_center">
                            <p class="slds-text-body_regular slds-text-color_weak">
                                No objects configured. Use the form above to add one.
                            </p>
                        </div>
                    </template>
                </div>
            </div>

            <!-- Job History -->
            <div class="slds-section slds-is-open">
                <h3 class="slds-section__title slds-theme_shade section-header">
                    <span class="slds-truncate slds-var-p-horizontal_small">
                        <lightning-icon icon-name="utility:date_time" size="x-small"
                            class="slds-var-m-right_x-small"></lightning-icon>
                        Job Execution History
                    </span>
                    <template if:true={hasHistory}>
                        <lightning-button label="Download CSV" icon-name="utility:download" variant="neutral"
                            onclick={downloadCsv} class="slds-var-m-right_small" size="small">
                        </lightning-button>
                    </template>
                </h3>
                <div class="slds-section__content">
                    <template if:true={hasHistory}>
                        <lightning-datatable key-field="id" data={jobHistory} columns={historyColumns}
                            hide-checkbox-column class="history-table">
                        </lightning-datatable>
                    </template>
                    <template if:false={hasHistory}>
                        <div class="slds-var-p-around_medium slds-text-align_center">
                            <p class="slds-text-body_regular slds-text-color_weak">No job history yet.</p>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </div>

    <!-- Run Masking Modal -->
    <template if:true={showRunModal}>
        <section role="dialog" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        onclick={handleCloseRunModal}>
                        <lightning-icon icon-name="utility:close" size="small" variant="inverse"></lightning-icon>
                    </button>
                    <h2 class="slds-modal__title slds-hyphenate">
                        <lightning-icon icon-name="utility:play" size="small"
                            class="slds-var-m-right_small"></lightning-icon>
                        Select Objects to Mask
                    </h2>
                </header>
                <div class="slds-modal__content slds-var-p-around_medium">
                    <template if:true={hasConfigs}>
                        <div class="slds-var-m-bottom_small">
                            <lightning-input type="checkbox" label="Select All" checked={allSelected}
                                onchange={handleSelectAll} class="select-all-checkbox"></lightning-input>
                        </div>
                        <div class="slds-border_top slds-var-p-top_small">
                            <template for:each={runModalItems} for:item="item">
                                <div key={item.objectName}
                                    class="slds-var-p-vertical_x-small slds-border_bottom run-modal-item">
                                    <lightning-input type="checkbox" label={item.label} checked={item.selected}
                                        data-obj={item.objectName} onchange={handleToggleRunItem}></lightning-input>
                                    <p class="slds-text-body_small slds-text-color_weak slds-var-m-left_xx-large">
                                        {item.fieldCount}
                                    </p>
                                </div>
                            </template>
                        </div>
                    </template>
                    <template if:false={hasConfigs}>
                        <div class="slds-text-align_center slds-var-p-around_large slds-text-color_weak">
                            No objects configured. Add an object first.
                        </div>
                    </template>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={handleCloseRunModal}
                        class="slds-var-m-right_small"></lightning-button>
                    <lightning-button variant="brand" label={runButtonLabel} icon-name="utility:play"
                        onclick={handleConfirmRun} disabled={isRunDisabled}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- Toast -->
    <template if:true={toastMessage}>
        <div class={toastClass}>
            <lightning-icon icon-name={toastIcon} size="x-small" class="slds-var-m-right_small"></lightning-icon>
            {toastMessage}
        </div>
    </template>
</template>
